# FoundersForge — Enterprise-grade Nginx config
# HTTPS + security headers + rate limiting + hardened TLS

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ─── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    server_name foundersforge.io www.foundersforge.io;
    return 301 https://foundersforge.io$request_uri;
}

# ─── www → non-www redirect (HTTPS) ─────────────────────────
server {
    listen 443 ssl http2;
    server_name www.foundersforge.io;

    ssl_certificate /etc/letsencrypt/live/foundersforge.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foundersforge.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://foundersforge.io$request_uri;
}

# ─── Main HTTPS server ──────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    server_name foundersforge.io;

    # ── TLS Configuration ────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/foundersforge.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foundersforge.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling (proves cert validity without contacting CA)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ─────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://foundersforge.io wss://foundersforge.io https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none';" always;

    # ── Server Hardening ─────────────────────────────────
    server_tokens off;
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # ── Web Frontend (static files) ──────────────────────
    root /var/www/founderos-web;
    index index.html;

    # ── Auth endpoints (stricter rate limit) ────────────
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # ── API proxy (/api/*) ───────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (streaming chat responses)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Hide backend details
        proxy_hide_header X-Powered-By;
    }

    # ── Static assets (aggressive caching) ───────────────
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ── Block dotfiles ───────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Block common attack paths ────────────────────────
    location ~* (wp-admin|wp-login|wp-content|phpmyadmin|\.php$) {
        deny all;
        return 404;
    }
}
